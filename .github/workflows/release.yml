name: Build and run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The image has both GCC and clang, and 'c++' is GCC. Coverage needs clang; the matrix job picks its
# compiler per leg and defaults to clang, which brings libc++ with it (USE_LIBCXX in CMakeLists.txt).
env:
  CC: clang
  CXX: clang++

jobs:
  #
  # Both I/O runtimes in all three flavors, on OpenSSL: COROSIO needs it (corosio's openssl_stream
  # uses a zero-copy BIO API that AWS-LC lacks), so it is the baseline rather than the default
  # AWS-LC. The legs after the product each isolate one variable the product holds fixed -- the
  # standard library, the TLS library -- so that a red job names its own cause. COROSIO TSAN is
  # the single-threaded one: -DMULTITHREADED is not covered here at all, so run
  # build-corosio-tsan/ locally.
  #
  # The runner image is pinned rather than ubuntu-latest: everything else about the build is
  # pinned too, down to the container, and the host is what is left to change under us -- the
  # rollover to 26.04 cost two days of red TSAN legs for reasons that had nothing to do with the
  # code (see the container options below). Bump it deliberately.
  #
  build:
    name: ${{ matrix.api }} ${{ matrix.flavor }}
    runs-on: &runs_on ubuntu-26.04
    container: &container
      image: docker.io/psedoc/anyhttp:0.32
      # The Ubuntu 26.04 runner kernel's ASLR entropy is high enough that the binary can land in
      # TSAN's fixed shadow region. TSAN then re-execs itself with
      # personality(ADDR_NO_RANDOMIZE), which docker's default seccomp profile refuses -- the job
      # dies before the first test.
      options: --security-opt seccomp=unconfined
    env:
      CC: ${{ matrix.cc || 'clang' }}
      CXX: ${{ matrix.cxx || 'clang++' }}

    strategy:
      fail-fast: false
      matrix:
        api: [ASIO, COROSIO]
        flavor: [RelWithDebInfo, ASAN, TSAN]
        include:
          # Flags per flavor, merged into the leg of each I/O runtime.
          - flavor: RelWithDebInfo
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - flavor: ASAN
            cmake: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
            opts: ASAN_OPTIONS=detect_leaks=1
          - flavor: TSAN
            cmake: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
            opts: TSAN_OPTIONS=report_signal_unsafe=0
          # Legs of their own: GCC and libstdc++ for both runtimes, and the other TLS library.
          - api: ASIO
            flavor: GCC
            cc: gcc
            cxx: g++
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - api: COROSIO
            flavor: GCC
            cc: gcc
            cxx: g++
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - api: ASIO
            flavor: AWS-LC
            tls: AWS-LC
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo

    steps:
      - &checkout
        name: Checkout code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DANYHTTP_API=${{ matrix.api }}
          -DTLS_LIBRARY=${{ matrix.tls || 'OpenSSL' }}
          ${{ matrix.cmake }}

      - &build
        name: Build
        run: cmake --build build --parallel

      - name: Check that OpenSSL is linked
        if: matrix.tls != 'AWS-LC'
        run: |
          ldd build/test/test_all | tee ldd.txt
          grep -q 'libssl\.so\.3' ldd.txt && grep -q 'libngtcp2_crypto_ossl' ldd.txt

      # A shared OpenSSL would interpose the executable's statically linked AWS-LC symbols.
      - name: Check that no shared OpenSSL is linked
        if: matrix.tls == 'AWS-LC'
        run: |
          ldd build/test/test_all | tee ldd.txt
          ! grep -qE 'lib(ssl|crypto)\.so\.3' ldd.txt

      - name: Run tests
        run: env ${{ matrix.opts }} build/test/test_all

      # Every test of a client once more, over TLS. External tools bring their own clients, so they
      # would only repeat themselves. On COROSIO, an HTTP/1.1 response can not be read over TLS once
      # a write has failed, which is what the tests left out there do: see step 8 of
      # docs/corosio-port-plan.md.
      - name: Run tests over TLS
        run: >
          env ${{ matrix.opts }} ANYHTTP_TEST_SCHEME=https build/test/test_all
          --gtest_filter=-External*${{ matrix.api == 'COROSIO' && ':ClientAsync/ClientAsync.WHEN_post_to_unknown_path_THEN_error_404/HTTP11:ClientAsyncCancellation/ClientAsyncCancellation.Cancellation/HTTP11:ClientAsyncCancellation/ClientAsyncCancellation.CancellationContentLength/HTTP11:ClientAsyncCancellation/ClientAsyncCancellation.CancellationRange/HTTP11:ClientAsyncCancellation/ClientAsyncCancellation.Backpressure/HTTP11' || '' }}

  #
  # anyhttp from the outside: installed and relocated, and as a FetchContent subproject. None of the
  # jobs above can see a usage requirement missing from the target, as they build it with the
  # flags of their own tree.
  #
  package:
    name: Package
    runs-on: *runs_on
    container: *container

    steps:
      - *checkout

      - name: Check installing and embedding
        run: scripts/check_package.sh

  #
  # The guide and the reference, with Doxygen and Sphinx, where warnings are errors: this is where a
  # public symbol without a comment shows, and a reference that goes nowhere. The tools are the
  # ones .devcontainer/Dockerfile installs, as the image does not have them: Doxygen, and pip, with
  # which the target installs the versions of Sphinx and Breathe that docs/requirements.txt pins.
  # Nothing is compiled.
  #
  docs:
    name: Documentation
    runs-on: *runs_on
    container: *container

    steps:
      - *checkout

      - name: Install the tools
        run: |
          apt-get update
          apt-get -y install --no-install-recommends \
            doxygen python3-pip python3-venv

      - name: Make the documentation
        run: |
          cmake --preset build
          cmake --build --preset build --target docs

      - name: Upload the documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/html/
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: *runs_on
    container: *container

    steps:
      - *checkout

      - name: Configure CMake with Coverage
        run: |
          cmake --preset build-coverage

      - name: Build
        run: cmake --build --preset build-coverage

      - name: Generate Coverage Report
        run: |
          cmake --build --preset build-coverage --target coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build-coverage/coverage_report/
          retention-days: 30

  #
  # A site has one deployment, so the documentation and the coverage report go out together: the
  # documentation at the root of the site, the report under coverage/. There is no point in
  # publishing one without the other, so a failure in either job holds this back. It builds
  # nothing, so it needs neither the container nor a checkout, and when GitHub's side of the
  # deployment fails, re-running this job alone takes seconds. A re-run keeps the artifacts of the
  # attempts before it, and deploy-pages refuses a name that two of them share, so the site's
  # artifact is named after the attempt.
  #
  pages:
    name: Pages
    needs: [ docs, coverage ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: *runs_on
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get the documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: pages/

      - name: Get the coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: pages/coverage/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
